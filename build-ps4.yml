name: OpenBOR PS4 - Fase 1 (diagnostico)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-22.04
    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis-PS4-Toolchain
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git

      - name: Baixar OpenOrbis PS4 Toolchain
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain "$OO_PS4_TOOLCHAIN"

      - name: Baixar codigo do OpenBOR
        run: git clone --depth 1 https://github.com/DCurrent/openbor openbor-src

      - name: Relatorio
        run: |
          {
            echo "== Toolchain =="; ls "$OO_PS4_TOOLCHAIN" "$OO_PS4_TOOLCHAIN/bin/linux" || true
            echo "== OpenBOR =="; ls openbor-src openbor-src/engine || true
            echo "== Makefile do engine (alvos/plataformas) =="; grep -n "BUILD_" openbor-src/engine/Makefile | head -60 || true
            echo "== Dependencias (includes) =="; grep -rhoE '#include <[^>]+>' openbor-src/engine --include=*.c --include=*.h | sort | uniq -c | sort -rn | head -60
          } | tee relatorio.txt

      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-fase1
          path: relatorio.txt
