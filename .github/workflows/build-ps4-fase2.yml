name: OpenBOR PS4 - Fase 2 (compilacao)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas do runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake ninja-build git

      - name: Toolchain OpenOrbis
        run: |
          mkdir tc
          gh release download v0.5.4 -R OpenOrbis/OpenOrbis-PS4-Toolchain -p 'toolchain-llvm-18.tar.gz' -D tc
          tar xzf tc/toolchain-llvm-18.tar.gz -C tc
          LINK=$(find tc -name link.x | head -1)
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$(dirname "$LINK")" >> "$GITHUB_ENV"
          git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo

      - name: Bibliotecas (zlib, png, ogg, vorbis)
        continue-on-error: true
        run: |
          T="-G Ninja -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ps4/toolchain.cmake"
          O="$OO_PS4_TOOLCHAIN"
          P="-DCMAKE_INSTALL_PREFIX=$O -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF"
          git clone -q --depth 1 --branch v1.3.1 https://github.com/madler/zlib z
          cmake -S z -B z/b $T > /dev/null
          cmake --build z/b --target zlibstatic > /dev/null
          cp z/zlib.h z/b/zconf.h $O/include/
          cp z/b/libzlibstatic.a $O/lib/libz.a
          git clone -q --depth 1 --branch v1.6.43 https://github.com/pnggroup/libpng p
          cmake -S p -B p/b $T $P -DZLIB_ROOT=$O -DZLIB_LIBRARY=$O/lib/libz.a -DZLIB_INCLUDE_DIR=$O/include -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_HARDWARE_OPTIMIZATIONS=OFF > /dev/null
          cmake --build p/b > /dev/null && cmake --install p/b > /dev/null
          git clone -q --depth 1 --branch v1.3.5 https://github.com/xiph/ogg o
          cmake -S o -B o/b $T $P -DINSTALL_DOCS=OFF > /dev/null
          cmake --build o/b > /dev/null && cmake --install o/b > /dev/null
          git clone -q --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis v
          cmake -S v -B v/b $T $P > /dev/null
          cmake --build v/b > /dev/null && cmake --install v/b > /dev/null
          ls $O/lib | grep -E "^lib(z|png|ogg|vorbis.*)\.a$"

      - name: Headers minimos
        run: |
          mkdir -p sh/sys
          echo '#pragma once' > sh/sys/sysinfo.h
          echo 'struct sysinfo{unsigned long uptime,totalram,freeram;unsigned mem_unit;};static inline int sysinfo(struct sysinfo*i){i->uptime=0;i->totalram=4UL<<30;i->freeram=2UL<<30;i->mem_unit=1;return 0;}' >> sh/sys/sysinfo.h
          printf '#if __has_include_next(<features.h>)\n#include_next <features.h>\n#endif\n' > sh/features.h
          printf '#if __has_include_next(<malloc.h>)\n#include_next <malloc.h>\n#else\n#include <stdlib.h>\n#endif\n' > sh/malloc.h

      - name: Codigo de inicio do PS4
        run: |
          cat > ps4_boot.c << 'EOF'
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          extern int __real_SDL_main(int argc, char **argv);
          static void L(const char *m) {
            FILE *f = fopen("/data/openbor/boot.txt", "a");
            if (f) { fputs(m, f); fputc('\n', f); fclose(f); }
          }
          int __wrap_SDL_main(int argc, char **argv) {
            mkdir("/data/openbor", 0777);
            mkdir("/data/openbor/Paks", 0777);
            mkdir("/data/openbor/Logs", 0777);
            mkdir("/data/openbor/Saves", 0777);
            mkdir("/data/openbor/ScreenShots", 0777);
            chdir("/data/openbor");
            L("boot: antes do OpenBOR");
            int r = __real_SDL_main(argc, argv);
            char b[64];
            snprintf(b, sizeof b, "boot: OpenBOR terminou com %d", r);
            L(b);
            return r;
          }
          EOF

      - name: Configurar OpenBOR
        id: cfg
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/DCurrent/openbor openbor-src
          sed -i 's/mallinfo2()\.arena/0/' openbor-src/engine/source/utils.c
          sed -i '/#error datetime.c currently supports/d' openbor-src/engine/source/openborscript/datetime.c
          echo "target_sources(OpenBOR PRIVATE \"$GITHUB_WORKSPACE/ps4_boot.c\")" >> openbor-src/CMakeLists.txt
          O="$OO_PS4_TOOLCHAIN"
          CF="-nostdlibinc -fPIC -funwind-tables -isysroot $O -isystem $GITHUB_WORKSPACE/sh -isystem $O/include -isystem $O/include/SDL2 -include sys/time.h"
          LIBS="-Wl,-Bdynamic -lc -lkernel -lc++ -lSceUserService -lSceVideoOut -lSceAudioOut -lScePad -lSceSysmodule -lSceFreeType"
          LD="-fuse-ld=lld -nostdlib -Wl,-m,elf_x86_64 -Wl,-pie -Wl,--wrap=SDL_main -Wl,--script,$O/link.x -Wl,--eh-frame-hdr -L$O/lib $O/lib/crt1.o"
          cmake -S openbor-src -B openbor-src/build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ps4/toolchain.cmake -DCMAKE_PREFIX_PATH=$O -DCMAKE_C_FLAGS="$CF" -DCMAKE_C_STANDARD_LIBRARIES="$LIBS" -DCMAKE_EXE_LINKER_FLAGS="$LD" -DBUILD_LINUX=ON -DUSE_OPENGL=OFF -DUSE_LOADGL=OFF -DUSE_WEBM=OFF -DUSE_GFX=ON -DUSE_PTHREAD=OFF -DENABLE_STATIC_SDL=ON 2>&1 | tee configure.log

      - name: Compilar OpenBOR
        if: steps.cfg.outcome == 'success'
        continue-on-error: true
        run: cmake --build openbor-src/build -- -k 0 2>&1 | tee build.log

      - name: Empacotar PKG
        if: always()
        continue-on-error: true
        run: |
          set +e
          B="$OO_PS4_TOOLCHAIN/bin/linux"
          chmod +x $B/* 2>/dev/null
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          if [ ! -f openbor-src/build/OpenBOR ]; then echo "sem executavel, nada a empacotar" > pkg.log; exit 0; fi
          {
            CID="IV0000-OPBR00001_00-OPENBORPS4000000"
            mkdir -p out/sce_sys out/sce_module
            cd out
            cp ../openbor-src/build/OpenBOR OpenBOR.elf
            cp $(find ../oo -type d -name sce_module | head -1)/*.prx sce_module/
            cp $(find ../oo/samples/hello_world -name icon0.png | head -1) sce_sys/icon0.png
            $B/create-fself -in=OpenBOR.elf -out=OpenBOR.oelf --eboot eboot.bin --paid 0x3800000000000011
            S="$B/PkgTool.Core sfo_setentry sce_sys/param.sfo"
            $B/PkgTool.Core sfo_new sce_sys/param.sfo
            $S APP_TYPE --type Integer --maxsize 4 --value 1
            $S APP_VER --type Utf8 --maxsize 8 --value '01.00'
            $S ATTRIBUTE --type Integer --maxsize 4 --value 0
            $S CATEGORY --type Utf8 --maxsize 4 --value 'gd'
            $S CONTENT_ID --type Utf8 --maxsize 48 --value "$CID"
            $S DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
            $S SYSTEM_VER --type Integer --maxsize 4 --value 0
            $S TITLE --type Utf8 --maxsize 128 --value 'OpenBOR'
            $S TITLE_ID --type Utf8 --maxsize 12 --value 'OPBR00001'
            $S VERSION --type Utf8 --maxsize 8 --value '01.00'
            $B/create-gp4 -out pkg.gp4 --content-id=$CID --files "eboot.bin sce_sys/param.sfo sce_sys/icon0.png $(ls sce_module/*.prx | tr '\n' ' ')"
            $B/PkgTool.Core pkg_build pkg.gp4 .
            ls -la
          } 2>&1 | tee ../pkg.log

      - name: Resumo
        if: always()
        continue-on-error: true
        run: |
          set +e
          R=resumo.txt
          grep -E "error:|undefined|ld.lld|cannot" build.log | sed -E 's#/home/runner/work/[^ ]*/openbor-src/##' | sort | uniq -c | sort -rn | head -20 > $R
          echo "== executavel ==" >> $R
          ls -la openbor-src/build/OpenBOR >> $R 2>&1
          ls -la out >> $R 2>&1
          cat $R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-fase2
          path: |
            resumo.txt
            pkg.log
            build.log
            out/*.pkg
            out/eboot.bin
