name: OpenBOR PS4 - Fase 2 (compilacao)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas do runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake ninja-build git

      - name: Toolchain OpenOrbis
        run: |
          mkdir tc
          gh release download v0.5.4 -R OpenOrbis/OpenOrbis-PS4-Toolchain -p 'toolchain-llvm-18.tar.gz' -D tc
          tar xzf tc/toolchain-llvm-18.tar.gz -C tc
          LINK=$(find tc -name link.x | head -1)
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$(dirname "$LINK")" >> "$GITHUB_ENV"
          git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain oo

      - name: Bibliotecas (zlib, png, ogg, vorbis)
        continue-on-error: true
        run: |
          T="-G Ninja -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ps4/toolchain.cmake"
          O="$OO_PS4_TOOLCHAIN"
          P="-DCMAKE_INSTALL_PREFIX=$O -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF"
          git clone -q --depth 1 --branch v1.3.1 https://github.com/madler/zlib z
          cmake -S z -B z/b $T > /dev/null
          cmake --build z/b --target zlibstatic > /dev/null
          cp z/zlib.h z/b/zconf.h $O/include/
          cp z/b/libzlibstatic.a $O/lib/libz.a
          git clone -q --depth 1 --branch v1.6.43 https://github.com/pnggroup/libpng p
          cmake -S p -B p/b $T $P -DZLIB_ROOT=$O -DZLIB_LIBRARY=$O/lib/libz.a -DZLIB_INCLUDE_DIR=$O/include -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_HARDWARE_OPTIMIZATIONS=OFF > /dev/null
          cmake --build p/b > /dev/null && cmake --install p/b > /dev/null
          git clone -q --depth 1 --branch v1.3.5 https://github.com/xiph/ogg o
          cmake -S o -B o/b $T $P -DINSTALL_DOCS=OFF > /dev/null
          cmake --build o/b > /dev/null && cmake --install o/b > /dev/null
          git clone -q --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis v
          cmake -S v -B v/b $T $P > /dev/null
          cmake --build v/b > /dev/null && cmake --install v/b > /dev/null
          ls $O/lib | grep -E "^lib(z|png|ogg|vorbis.*)\.a$"

      - name: Headers minimos
        run: |
          mkdir -p sh/sys
          echo '#pragma once' > sh/sys/sysinfo.h
          echo 'struct sysinfo{unsigned long uptime,totalram,freeram;unsigned mem_unit;};static inline int sysinfo(struct sysinfo*i){i->uptime=0;i->totalram=4UL<<30;i->freeram=2UL<<30;i->mem_unit=1;return 0;}' >> sh/sys/sysinfo.h
          printf '#if __has_include_next(<features.h>)\n#include_next <features.h>\n#endif\n' > sh/features.h
          printf '#if __has_include_next(<malloc.h>)\n#include_next <malloc.h>\n#else\n#include <stdlib.h>\n#endif\n' > sh/malloc.h

      - name: Configurar OpenBOR
        id: cfg
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/DCurrent/openbor openbor-src
          sed -i 's/mallinfo2()\.arena/0/' openbor-src/engine/source/utils.c
          sed -i '/#error datetime.c currently supports/d' openbor-src/engine/source/openborscript/datetime.c
          O="$OO_PS4_TOOLCHAIN"
          CF="-nostdlibinc -fPIC -funwind-tables -isysroot $O -isystem $GITHUB_WORKSPACE/sh -isystem $O/include -isystem $O/include/SDL2 -include sys/time.h"
          LIBS="-lc -lkernel -lc++ -lSceUserService -lSceVideoOut -lSceAudioOut -lScePad -lSceSysmodule -lSceFreeType"
          LD="-fuse-ld=lld -nostdlib -Wl,-m,elf_x86_64 -Wl,-pie -Wl,--script,$O/link.x -Wl,--eh-frame-hdr -L$O/lib -L$GITHUB_WORKSPACE/oo/lib $O/lib/crt1.o"
          cmake -S openbor-src -B openbor-src/build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ps4/toolchain.cmake -DCMAKE_PREFIX_PATH=$O -DCMAKE_C_FLAGS="$CF" -DCMAKE_C_STANDARD_LIBRARIES="$LIBS" -DCMAKE_EXE_LINKER_FLAGS="$LD" -DBUILD_LINUX=ON -DUSE_OPENGL=OFF -DUSE_LOADGL=OFF -DUSE_WEBM=OFF -DUSE_GFX=OFF -DUSE_PTHREAD=OFF -DENABLE_STATIC_SDL=ON 2>&1 | tee configure.log

      - name: Compilar OpenBOR
        if: steps.cfg.outcome == 'success'
        continue-on-error: true
        run: cmake --build openbor-src/build -- -k 0 2>&1 | tee build.log

      - name: Resumo
        if: always()
        continue-on-error: true
        run: |
          set +e
          R=resumo.txt
          grep -E "error:|undefined|ld.lld|cannot" build.log | sed -E 's#/home/runner/work/[^ ]*/openbor-src/##' | sort | uniq -c | sort -rn | head -30 > $R
          echo "== arquivos de sistema do PS4 (stubs) ==" >> $R
          find tc oo -name "libkernel*" -o -name "libSceVideoOut*" -o -name "libScePad*" 2>/dev/null | head -12 >> $R
          echo "== lib do tc ==" >> $R
          ls $OO_PS4_TOOLCHAIN/lib | head -50 >> $R
          echo "== resultado ==" >> $R
          ls -la openbor-src/build/OpenBOR >> $R 2>&1
          cat $R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-fase2
          path: |
            resumo.txt
            configure.log
            build.log
